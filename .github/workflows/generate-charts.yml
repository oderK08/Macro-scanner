name: Générer les graphiques

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-dashboard
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer tous les graphiques
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python run_all.py

      - name: Compiler le rapport PDF
        run: python compile_report.py

      - name: Sauvegarder les résultats dans le repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Graphiques et rapport générés automatiquement"
          git push

      # Reproduit get_current_period_label() de common/config.py (année + S1/S2)
      # en shell pur : pas d'import Python ici, car config.py écrit des
      # avertissements sur stdout qui pollueraient $GITHUB_OUTPUT.
      - name: Déterminer la période courante
        id: periode
        run: |
          annee=$(date -u +%Y)
          mois=$(date -u +%-m)
          if [ "$mois" -le 6 ]; then semestre=1; else semestre=2; fi
          echo "label=${annee}S${semestre}" >> "$GITHUB_OUTPUT"

      - name: Publier le rapport et les graphiques sous le run
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ steps.periode.outputs.label }}
          path: research-dashboard/output/${{ steps.periode.outputs.label }}/
          if-no-files-found: error
